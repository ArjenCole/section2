[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "section2"
version = "2.0.0.0"
description = "线性工程（市政管道）工程量计算软件 2.0"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "PySide6>=6.6",
    "SQLAlchemy>=2.0",
    "lxml>=5.0",
    "openpyxl>=3.1",
    "httpx>=0.27",
    "keyring>=25",
    "platformdirs>=4",
    "simpleeval>=1.0",
    # config.toml 写入（读取用标准库 tomllib）
    "tomli-w>=1.0",
    # mac 无边框外观：透明标题栏 + 红绿灯按钮（见 app/views/widgets/mac_window.py）
    "pyobjc-framework-Cocoa>=10 ; sys_platform == 'darwin'",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pyinstaller>=6",
]

[project.scripts]
section2 = "app.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
